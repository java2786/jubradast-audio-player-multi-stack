<body id="top">
    <div class="app-shell">
        <header class="site-header">
            <a class="brand" href="#top" aria-label="Jabardast Music home">
                <span class="brand-mark" aria-hidden="true">JM</span>
                <span>Jabardast Music</span>
            </a>
            <nav aria-label="Page navigation">
                <a class="back-link" href="#player"><span aria-hidden="true">&larr;</span> Back to player</a>
            </nav>

        <main class="page-content">
            <section class="player-dock player-card" id="player" aria-label="Music player">
                <div class="player-header">
                    <span class="live-dot"></span>
                    <span>Retro Station</span>
                </div>
                <h2 id="now-playing">Now playing: <strong id="current-song">Default track</strong></h2>
                <iframe id="main-player" width="336" height="189"
                    src="https://www.youtube.com/embed/TQkn1uv4AcM?autoplay=1&enablejsapi=1" allowfullscreen></iframe>
                <div class="controls-group">
                    <button onclick="playMusic('main-player')">&#9654; Play</button>
                    <button onclick="pauseMusic('main-player')">&#9208; Stop</button>
                    <!-- <button onclick="toggleElement('main-player')">Toggle</button> -->
                </div>
            </section>

            <section class="hero" aria-labelledby="page-title">
                <p class="eyebrow">Find your next favorite</p>
                <h1 id="page-title">Playlist Directory</h1>
                <p class="hero-subtitle">Pick a song and let the memories play.</p>
            </section>

            <section class="playlist-section player-card" aria-labelledby="station-label">
                <div class="playlist-heading">
                    <div class="player-header">
                        <span class="live-dot"></span>
                        <span id="station-label">Retro Station</span>
                    </div>
                    <p>Select a track to play</p>
                </div>
                <ul id="songs-list" aria-label="Songs"></ul>
            </section>
        </main>

        <footer class="site-footer">
            <a class="footer-brand" href="#top">
                <span class="brand-mark" aria-hidden="true">JM</span>
                <span class="footer-copy">
                    <strong>Jabardast Music</strong>
                    <span>Built for Learners</span>
                </span>
            </a>
            <a class="back-to-top" href="#top">Back to top <span aria-hidden="true">&uarr;</span></a>
        </footer>
    </div>

    <script>
        toggleElement('main-player')
        function toggleElement(id) {
            const el = document.getElementById(id);
            if (!el) return;

            if (el.style.position !== "absolute") {
                el.style.opacity = 0;
                el.style.position = "absolute"
                el.style.pointerEvents = "none"
                el.style.height = "0px";
                el.style.width = "0px";
            } else {
                el.style.opacity = 1;
                el.style.position = ""
                el.style.pointerEvents = ""
                el.style.width = "336px";
                el.style.height = "189px";
            }
        }

        function myAction(id, action) {
            const iframe = document.getElementById(id);
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage(JSON.stringify({
                    event: "command",
                    func: action,
                    args: []
                }), "https://www.youtube.com");

            }
        }

        function playMusic(id) {
            myAction(id, "playVideo")
